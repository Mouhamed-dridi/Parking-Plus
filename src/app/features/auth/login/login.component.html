<div class="login-container">
  <div class="bg-mesh"></div>

  <div class="login-card">
    <div class="logo-section">
      <div class="logo-icon">
        <span nz-icon nzType="car" nzTheme="outline"></span>
      </div>
      <h2>ParkPlus</h2>
      <p class="logo-tagline">Parking Management Platform</p>
    </div>

    <div class="error-banner" *ngIf="errorMessage">
      <span nz-icon nzType="close-circle" nzTheme="fill"></span>
      <span>{{ errorMessage }}</span>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="login">Login</label>
        <input 
          type="text" 
          id="login" 
          name="login"
          placeholder="Enter your login" 
          [(ngModel)]="email" 
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input-wrapper">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            name="password"
            placeholder="••••••••" 
            [(ngModel)]="password" 
            autocomplete="current-password"
          />
          <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
            <span nz-icon [nzType]="showPassword ? 'eye-invisible' : 'eye'" nzTheme="outline"></span>
          </button>
        </div>
      </div>

      <button type="submit" class="submit-btn" [class.loading]="isLoading" [disabled]="isLoading">
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading" nz-icon nzType="loading" nzTheme="outline"></span>
      </button>

      <p class="form-hint">Demo: admin / admin &nbsp;|&nbsp; drv123 / drv123</p>
    </form>
  </div>
</div>
